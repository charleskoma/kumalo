*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}

header.site{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:32px;height:64px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em}
.logo span{color:var(--accent)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:8px;transition:color .15s,background .15s}
nav.main a:hover{color:var(--ink);background:var(--surface)}
@media (max-width:720px){nav.main{display:none}.wrap{padding:0 18px}}
.page{max-width:720px;margin:0 auto;padding:0 24px 24px}
.page h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.03em;margin:36px 0 6px}

.page h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:34px 0 10px}
.page p,.page li{margin-bottom:14px;color:#2A303A}
.page ul{padding-left:22px}
.page a{color:var(--accent);font-weight:600}
.page a:hover{text-decoration:underline}
.card{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;margin:24px 0}
.card b{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.card p{margin-bottom:14px}.card p:last-child{margin-bottom:0}
footer.site{border-top:1px solid var(--line);margin-top:56px;padding:32px 0 28px}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
