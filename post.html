<style>
:root{
  --bg:#FFFFFF;--surface:#F6F7F8;--ink:#101418;--muted:#5F6672;--line:#E8EAED;

}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:8px 16px;border-radius:0 0 10px 0;font-size:14px;font-weight:600;z-index:200}
.skip:focus{left:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.kicker{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.meta{font-size:13px;color:var(--muted)}

header.site{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em}
.logo span{color:var(--accent)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{font-size:14px;font-weight:500;color:var(--muted);padding:8px 11px;border-radius:8px;transition:color .15s,background .15s;white-space:nowrap}
nav.main a:hover{color:var(--ink);background:var(--surface)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:38px;font-size:17px;margin-left:auto}
nav.main.open{display:flex;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;gap:2px;padding:12px 24px 16px;border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(16,20,24,.06)}
nav.main.open a{padding:12px}
@media (max-width:920px){nav.main{display:none}.menu-btn{display:block}}
@media (max-width:720px){.wrap{padding:0 18px}}

.ad-slot{margin:28px auto;text-align:center}
.ad-slot .ad-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9AA1AB;margin-bottom:8px}
.ad-frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ad-frame.mpu{min-height:250px;max-width:336px;margin:0 auto}
.house-ad{display:block;padding:26px 22px;width:100%}

.custom-ad .txt h4{font-size:15.5px;font-weight:700;margin-bottom:3px}
.custom-ad .txt p{font-size:13px;color:var(--muted);margin-bottom:8px}

/* ============ ARTICLE ============ */

.byline{display:flex;align-items:center;gap:14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.byline .who b{display:block;font-size:14px;font-weight:600}
.byline .who span{font-size:12.5px;color:var(--muted)}

.share button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color .15s,border-color .15s}

figure{margin-bottom:28px}
.feature-img{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:var(--surface)}

.article-body{font-family:'Source Serif 4',Georgia,serif;font-size:18.5px;line-height:1.8;color:#1C2128}
.article-body p{margin-bottom:24px}
.article-body h2{font-family:'Inter',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:38px 0 14px;line-height:1.25}
.article-body h3{font-family:'Inter',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:30px 0 12px;line-height:1.3}
.article-body a{color:var(--accent);font-weight:600}
.article-body a:hover{text-decoration:underline}
.article-body ul{margin:0 0 24px 22px}
.article-body li{margin-bottom:10px}
.article-body figure{margin:34px 0}
.article-body figure img{border-radius:var(--r-lg);width:100%}
.article-body figcaption{margin-top:10px}
blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 24px;margin:34px 0;font-size:22px;line-height:1.5;font-weight:600;color:var(--ink)}
blockquote cite{display:block;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;font-style:normal;color:var(--muted);margin-top:10px}
.video-embed{margin:34px 0}
.video-frame{position:relative;padding-top:56.25%;border-radius:var(--r-lg);overflow:hidden;background:#000}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-embed video{width:100%;border-radius:var(--r-lg);background:#000;display:block}
.video-embed figcaption{margin-top:10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:36px 0 8px}
.tags a{background:var(--surface);border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);padding:7px 14px;transition:color .15s,background .15s}
.tags a:hover{background:var(--ink);color:#fff}

/* Related */
.section-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin:48px 0 24px}
.section-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.related{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:8px}
.related .thumb{border-radius:var(--r-sm);overflow:hidden;aspect-ratio:16/10;background:var(--surface);margin-bottom:12px}
.related .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.related a:hover .thumb img{transform:scale(1.03)}
.related h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:6px 0;transition:color .15s}
.related a:hover h3{color:var(--accent)}
@media (max-width:720px){.related{grid-template-columns:1fr}.share{margin-left:0;width:100%}}

footer.site{border-top:1px solid var(--line);margin-top:56px;padding:32px 0 28px}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot-bottom a{font-weight:500}
.foot-bottom a:hover{color:var(--accent)}
</style>

<script>
/* ============================================================
   SANITY CONNECTION — same setup as index.html
============================================================ */
const SANITY_PROJECT_ID = "y0yye7lu";
const SANITY_DATASET = "production";
const SANITY_API_VERSION = "v2024-01-01";

function sanityQueryUrl(query, params){
  const base = "https://" + SANITY_PROJECT_ID + ".api.sanity.io/" + SANITY_API_VERSION + "/data/query/" + SANITY_DATASET;
  const usp = new URLSearchParams();
  usp.set("query", query);
  if (params){
    Object.keys(params).forEach(function(k){ usp.set("$" + k, JSON.stringify(params[k])); });
  }
  return base + "?" + usp.toString();
}

async function sanityFetch(query, params){
  const res = await fetch(sanityQueryUrl(query, params));
  if (!res.ok) throw new Error("Sanity request failed: " + res.status);
  const json = await res.json();
  return json.result;
}

function urlForImage(source, width){
  if (!source || !source.asset || !source.asset._ref) return "";
  const parts = source.asset._ref.split("-");
  const id = parts[1], dims = parts[2], format = parts[3];
  let url = "https://cdn.sanity.io/images/" + SANITY_PROJECT_ID + "/" + SANITY_DATASET + "/" + id + "-" + dims + "." + format;
  if (width) url += "?w=" + width + "&auto=format";
  return url;
}

function urlForFile(source){
  if (!source || !source.asset || !source.asset._ref) return "";
  const parts = source.asset._ref.split("-"); // ["file", id, format]
  const id = parts[1], format = parts[2];
  return "https://cdn.sanity.io/files/" + SANITY_PROJECT_ID + "/" + SANITY_DATASET + "/" + id + "." + format;
}

function escapeHTML(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function formatDate(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});
}

function postUrl(slug){
  return "post.html?slug=" + encodeURIComponent(slug);
}

function youtubeIdFromUrl(url){
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  return m ? m[1] : null;
}

/* ============ PORTABLE TEXT RENDERER ============
   Handles exactly the block types defined in the Sanity schema:
   normal/h2/h3/blockquote text blocks, inline images, and the
   custom videoBlock (YouTube or uploaded file). */
function renderBlockChildren(children){
  return (children || []).map(function(child){
    let text = escapeHTML(child.text || "");
    const marks = child.marks || [];
    if (marks.includes("strong")) text = "<strong>" + text + "</strong>";
    if (marks.includes("em")) text = "<em>" + text + "</em>";
    return text;
  }).join("");
}

function renderPortableText(blocks){
  if (!Array.isArray(blocks)) return "";
  return blocks.map(function(block){
    if (block._type === "block"){
      const tag = block.style === "h2" ? "h2" : block.style === "h3" ? "h3" : block.style === "blockquote" ? "blockquote" : "p";
      return "<" + tag + ">" + renderBlockChildren(block.children) + "</" + tag + ">";
    }
    if (block._type === "image"){
      const src = urlForImage(block, 1200);
      const alt = escapeHTML(block.alt || "");
      const caption = block.caption ? "<figcaption>" + escapeHTML(block.caption) + "</figcaption>" : "";
      return '<figure><img src="' + src + '" alt="' + alt + '" loading="lazy">' + caption + "</figure>";
    }
    if (block._type === "videoBlock"){
      const caption = block.caption ? "<figcaption>" + escapeHTML(block.caption) + "</figcaption>" : "";
      if (block.source === "youtube" && block.youtubeUrl){
        const id = youtubeIdFromUrl(block.youtubeUrl);
        if (!id) return "";
        return '<figure class="video-embed"><div class="video-frame">' +
          '<iframe src="https://www.youtube.com/embed/' + id + '" title="' + escapeHTML(block.caption || "YouTube video") +
          '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>' +
          "</div>" + caption + "</figure>";
      }
      if (block.source === "upload" && block.uploadedFile){
        const src = urlForFile(block.uploadedFile);
        return '<figure class="video-embed"><video controls preload="metadata" src="' + src + '"></video>' + caption + "</figure>";
      }
      return "";
    }
    return "";
  }).join("");
}

/* ============ RENDER FULL ARTICLE ============ */
function renderArticle(post){
  document.getElementById("pageTitle").textContent = post.title + " — Kumalo";
  document.getElementById("metaDescription").setAttribute("content", post.excerpt || "");
  document.getElementById("ogTitle").setAttribute("content", post.title);
  document.getElementById("ogDescription").setAttribute("content", post.excerpt || "");

  document.getElementById("crumbs").innerHTML =
    '<a href="index.html">Home</a> / <a href="category.html?cat=' + encodeURIComponent(post.category) + '">' + escapeHTML(post.category) + "</a>";

  const coverSrc = urlForImage(post.coverImage, 1200);
  const coverAlt = escapeHTML((post.coverImage && post.coverImage.alt) || post.title);
  const authorInitial = escapeHTML((post.author || "K").charAt(0).toUpperCase());
  const metaLine = formatDate(post.publishedAt) + (post.readTime ? " · " + post.readTime + " min read" : "");

  let html = "";
  html += '<span class="kicker">' + escapeHTML(post.category) + "</span>";
  html += "<h1>" + escapeHTML(post.title) + "</h1>";
  if (post.excerpt) html += '<p class="standfirst">' + escapeHTML(post.excerpt) + "</p>";
  html += '<div class="byline">' +
    '<span class="avatar">' + authorInitial + '</span>' +
    '<div class="who"><b>' + escapeHTML(post.author || "Kumalo") + '</b><span>' + metaLine + '</span></div>' +
    '<div class="share" aria-label="Share">' +
      '<button onclick="share(\'x\')">Share on X</button>' +
      '<button onclick="share(\'wa\')">WhatsApp</button>' +
      '<button onclick="share(\'copy\')">Copy link</button>' +
    "</div></div>";
  if (coverSrc){
    html += '<figure><div class="feature-img"><img src="' + coverSrc + '" alt="' + coverAlt + '"></div></figure>';
  }
  html += '<div class="article-body">' + renderPortableText(post.body) + "</div>";

  document.getElementById("postContent").innerHTML = html;

  const tagsRow = document.getElementById("tagsRow");
  if (post.tags && post.tags.length){
    tagsRow.innerHTML = post.tags.map(function(t){ return '<a href="#">' + escapeHTML(t) + "</a>"; }).join("");
    tagsRow.style.display = "";
  }
}

function renderRelated(posts){
  const section = document.getElementById("relatedSection");
  if (!posts.length){ section.style.display = "none"; return; }
  document.getElementById("relatedGrid").innerHTML = posts.map(function(post){
    const img = urlForImage(post.coverImage, 500);
    const alt = escapeHTML((post.coverImage && post.coverImage.alt) || post.title);
    const meta = formatDate(post.publishedAt) + (post.readTime ? " · " + post.readTime + " min" : "");
    return '<article><a href="' + postUrl(post.slug) + '">' +
      '<div class="thumb"><img src="' + img + '" width="500" height="320" alt="' + alt + '" loading="lazy"></div>' +
      '<span class="kicker">' + escapeHTML(post.category) + '</span>' +
      "<h3>" + escapeHTML(post.title) + "</h3>" +
      '<div class="meta">' + meta + "</div>" +
      "</a></article>";
  }).join("");
  section.style.display = "";
}

const POST_QUERY = '*[_type == "post" && slug.current == $slug][0]{' +
  'title, "slug": slug.current, category, excerpt, coverImage, author, publishedAt, readTime, body, tags}';
const RELATED_QUERY = '*[_type == "post" && category == $category && slug.current != $slug] | order(publishedAt desc)[0...3]{' +
  'title, "slug": slug.current, category, coverImage, publishedAt, readTime}';

async function loadArticle(){
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");

  if (!slug){
    document.getElementById("postContent").innerHTML =
      '<p class="meta" style="padding:40px 0">No article specified. <a href="index.html">Back to homepage →</a></p>';
    return;
  }

  let post;
  try {
    post = await sanityFetch(POST_QUERY, {slug: slug});
  } catch (e) {
    console.error(e);
    document.getElementById("postContent").innerHTML =
      '<p class="meta" style="padding:40px 0">Unable to load this article right now — please refresh.</p>';
    return;
  }

  if (!post){
    document.getElementById("postContent").innerHTML =
      '<p class="meta" style="padding:40px 0">This article couldn\'t be found. <a href="index.html">Back to homepage →</a></p>';
    return;
  }

  renderArticle(post);

  // Send an accurate, article-specific pageview now that we know the real
  // title and URL. Automatic pageview was disabled above (send_page_view:
  // false) specifically so every article gets counted correctly instead of
  // all collapsing into one generic "post.html" entry in your reports.
  if (window.gtag){
    gtag('event', 'page_view', {
      page_title: post.title + " — Kumalo",
      page_path: location.pathname + location.search,
      page_location: location.href
    });
  }

  try {
    const related = await sanityFetch(RELATED_QUERY, {category: post.category, slug: post.slug});
    renderRelated(related || []);
  } catch (e) {
    console.error(e);
    renderRelated([]);
  }
}

(function initAds(){
  document.querySelectorAll("[data-ad-slot]").forEach(function(el){
    const name = el.getAttribute("data-ad-slot");
    const cfg  = AD_CONFIG.slots[name] || { mode: "auto" };
    const frame = el.querySelector(".ad-frame") || el;
    let mode = cfg.mode;
    if (mode === "auto") {
      if (AD_CONFIG.adsenseClient && cfg.adsenseSlotId) mode = "adsense";
      else if (AD_CONFIG.customAds.length) mode = "custom";
      else mode = "house";
    }
    if (mode === "adsense") renderAdsense(frame, cfg);
    else if (mode === "custom" && AD_CONFIG.customAds.length) renderCustom(frame, name);
    else renderHouse(frame);
  });
  function renderAdsense(frame, cfg){
    frame.style.background = "transparent"; frame.style.border = "none";
    frame.innerHTML = '<ins class="adsbygoogle" style="display:block;width:100%"' +
      ' data-ad-client="' + AD_CONFIG.adsenseClient + '"' +
      ' data-ad-slot="' + cfg.adsenseSlotId + '"' +
      ' data-ad-format="' + (cfg.format || "auto") + '"' +
      ' data-full-width-responsive="true"></ins>';
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){}
  }
  function renderCustom(frame, slotName){
    const ad = pickWeighted(AD_CONFIG.customAds);
    const stacked = (slotName === "article_end");
    const art = ad.imageUrl
      ? '<div class="art" style="background-image:url(' + ad.imageUrl + ')"></div>'
      : '<div class="art" style="background:' + (ad.bg || "#101418") + '">' + (ad.art || "AD") + '</div>';
    frame.innerHTML =
      '<a class="custom-ad' + (stacked ? " stack" : "") + '" href="' + ad.url + '" target="_blank" rel="noopener sponsored">' +
        art + '<div class="txt"><h4>' + ad.headline + '</h4><p>' + ad.body + '</p>' +
        '<span class="cta">' + (ad.cta || "Learn more") + ' →</span></div></a>';
  }
  function renderHouse(frame){
    frame.innerHTML = '<a class="house-ad" href="' + AD_CONFIG.houseAd.url + '">' +
      '<h4>' + AD_CONFIG.houseAd.headline + '</h4><p>' + AD_CONFIG.houseAd.body + '</p>' +
      '<span class="go">' + AD_CONFIG.houseAd.cta + ' →</span></a>';
  }
  function pickWeighted(list){
    const total = list.reduce((s,a)=>s+(a.weight||1),0);
    let r = Math.random()*total;
    for (const a of list){ r -= (a.weight||1); if (r <= 0) return a; }
    return list[0];
  }
})();

function share(kind){
  const url = location.href, title = document.title;
  if (kind === "x") window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent(url));
  else if (kind === "wa") window.open("https://wa.me/?text=" + encodeURIComponent(title + " " + url));
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>alert("Link copied"));
  else prompt("Copy this link:", url);
}

loadArticle();
</script>
